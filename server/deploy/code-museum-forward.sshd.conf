# Install as a reviewed sshd_config.d fragment on xshow2 only; verify with sshd -t.
# The dedicated identity can make only local-forward channels to its loopback worker.
Match User code-museum-forward
    AllowTcpForwarding local
    AllowStreamLocalForwarding no
    PermitOpen 127.0.0.1:4181
    PermitListen none
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    MaxSessions 0
    PermitUserRC no
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
Match all
