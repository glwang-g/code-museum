# Same-origin HTTPS proxy; execution requires private Bearer token + session in backend.
# Metadata is public; no credentials or code are logged/spooled here.
location ~ "^/api/(runtimes|executor-status|executions(/[a-f0-9]{32})?)$" {
    client_max_body_size 96k;
    client_body_timeout 5s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:4181;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Execution-Session $http_x_execution_session;
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 10s;
    proxy_connect_timeout 2s;
    access_log off;
}

# Read-only MCP has a distinct derived Bearer token; no anonymous query or execution tool.
location = /mcp {
    client_max_body_size 64k;
    client_body_timeout 5s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:4181;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Origin $http_origin;
    proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
    proxy_read_timeout 10s;
    proxy_connect_timeout 2s;
    access_log off;
}
