# Same-origin HTTPS proxy. Guest admission is opt-in in the gateway; workers stay private.
# Install executor-guest-http.nginx.conf in http context before enabling guest access.
# Metadata is public; no credentials or code are logged/spooled here.
location = /api/executions {
    limit_req zone=code_museum_execution_submit burst=5 nodelay;
    limit_req_status 429;
    error_page 429 = @code_museum_execution_busy;
    client_max_body_size 96k;
    client_body_timeout 5s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:4181;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Execution-Session $http_x_execution_session;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 10s;
    proxy_connect_timeout 2s;
    access_log off;
}

location @code_museum_execution_busy {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "5" always;
    return 429 '{"error":"当前访问比较多，请稍后重试。","code":"execution_busy","retryAfterSeconds":5,"retrySafe":true}';
}

location ~ "^/api/(runtimes|executor-status|executions(/[a-f0-9]{32})?)$" {
    client_max_body_size 96k;
    client_body_timeout 5s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:4181;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Execution-Session $http_x_execution_session;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 10s;
    proxy_connect_timeout 2s;
    access_log off;
}

# Read-only MCP has a distinct derived Bearer token; no anonymous query or execution tool.
location = /mcp {
    client_max_body_size 64k;
    client_body_timeout 5s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:4181;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Origin $http_origin;
    proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
    proxy_read_timeout 10s;
    proxy_connect_timeout 2s;
    access_log off;
}
