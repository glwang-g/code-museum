# This file is a template. Merge the independent virtual host into existing Nginx;
# retain its shared MIME map and ACME/certificate conventions.
# The limit_req_zone belongs in the http context, outside any server block.
limit_req_zone $binary_remote_addr zone=code_museum_visits:1m rate=2r/s;

server {
    listen 80;
    server_name codemuseum.freexlib.com;
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name codemuseum.freexlib.com;
    ssl_certificate /etc/letsencrypt/live/codemuseum.freexlib.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codemuseum.freexlib.com/privkey.pem;
    root /var/www/code-museum/current/dist;
    index index.html;
    # Match the host's existing compression configuration if Brotli is available.
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm;
    location / { try_files $uri $uri/ =404; }
    location = /api/visits {
        limit_except POST { deny all; }
        client_max_body_size 1k;
        limit_req zone=code_museum_visits burst=10 nodelay;
        proxy_pass http://127.0.0.1:4180;
        proxy_read_timeout 15s;
        # Keep Origin and User-Agent for same-origin validation and basic bot exclusion.
        access_log off;
    }
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }
    location ~ \.wasm$ {
        types { application/wasm wasm; }
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
}
