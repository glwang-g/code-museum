# This file is a template. Merge the independent virtual host into existing Nginx;
# retain its shared MIME map and ACME/certificate conventions.
# The limit_req_zone belongs in the http context, outside any server block.
limit_req_zone $binary_remote_addr zone=code_museum_visits:1m rate=2r/s;
limit_req_zone $binary_remote_addr zone=code_museum_messages:1m rate=2r/s;

server {
    listen 80;
    server_name codemuseum.freexlib.com;
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name codemuseum.freexlib.com;
    ssl_certificate /etc/letsencrypt/live/codemuseum.freexlib.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codemuseum.freexlib.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/code-museum/current/dist;
    index index.html;
    # Match the host's existing compression configuration if Brotli is available.
    add_header Cache-Control "no-cache" always;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/wasm;
    # Only content-addressed files may be cached across releases.
    location ~ \.[a-f0-9]{12}\.(js|css|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
    location = /api/visits {
        limit_except GET POST { deny all; }
        client_max_body_size 1k;
        limit_req zone=code_museum_visits burst=10 nodelay;
        proxy_pass http://127.0.0.1:4180;
        proxy_read_timeout 15s;
        # Keep Origin and User-Agent for same-origin validation and basic bot exclusion.
        access_log off;
    }
    # Guest book: reads are public, writes are same-origin and size-limited.
    location = /api/messages {
        limit_except GET POST { deny all; }
        client_max_body_size 8k;
        limit_req zone=code_museum_messages burst=8 nodelay;
        proxy_pass http://127.0.0.1:4180;
        proxy_read_timeout 15s;
        # Keep Origin for same-origin validation; never log visitor text.
        access_log off;
    }
    # Administrator-only visibility toggle; the backend also requires a bearer token.
    location ~ "^/api/messages/[a-f0-9]{32}/visibility$" {
        limit_except POST { deny all; }
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:4180;
        proxy_read_timeout 15s;
        access_log off;
    }
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }
    location ~ \.wasm$ {
        types { application/wasm wasm; }
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
}
