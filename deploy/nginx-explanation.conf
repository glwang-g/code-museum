# Include in the Code Museum HTTPS server block only.
location = /api/explanations {
    limit_except POST { deny all; }
    client_max_body_size 32k;
    limit_req zone=code_museum_explanations burst=2 nodelay;
    limit_req_status 429;
    error_page 429 = @museum_explanation_busy;
    proxy_pass http://127.0.0.1:4185;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 38s;
    proxy_connect_timeout 2s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    access_log off;
    error_log /dev/null crit;
}
location @museum_explanation_busy {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "60" always;
    return 429 '{"error":"当前讲解请求比较多，请稍后重试。","code":"busy"}';
}
